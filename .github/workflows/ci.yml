name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - color-fix-staging
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      routing-redis:
        image: redis:7.4-alpine
        ports:
          - 6389:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: newapi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newapi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Race-test subscription transaction regression
        run: go test -race ./model -run '^TestSubscriptionV1ReserveSettleAndReplay$' -count=1

      - name: Test transaction DB-time lookup on supported SQL services
        env:
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/newapi_test?charset=utf8mb4&parseTime=True&loc=Local
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/newapi_test?sslmode=disable
        run: go test ./model -run '^TestGetDBTimestampFromTransactionWithSingleConnection$' -count=1

      - name: Test root and relaykit modules

        env:
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/newapi_test?charset=utf8mb4&parseTime=True&loc=Local
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/newapi_test?sslmode=disable
        run: make test

      - name: Test shared email verification across SQL engines
        env:
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/newapi_test?charset=utf8mb4&parseTime=True&loc=Local
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/newapi_test?sslmode=disable
        run: |
          TEST_EMAIL_DIALECT=mysql go test ./model -run '^TestSharedEmailVerification$' -count=1
          TEST_EMAIL_DIALECT=postgres go test ./model -run '^TestSharedEmailVerification$' -count=1

      - name: Test authorization seeding across SQL engines
        env:
          MYSQL_PWD: root
          PGPASSWORD: postgres
          TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/codex_authz_ci?charset=utf8mb4&parseTime=True&loc=Local
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/codex_authz_ci?sslmode=disable
        run: |
          mysql -h 127.0.0.1 -u root -e 'CREATE DATABASE codex_authz_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          psql -h 127.0.0.1 -U postgres -d newapi_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE codex_authz_ci'
          go test ./service/authz -run '^TestInitSeedDatabaseMatrix$' -count=1

      - name: Test model routing with real Redis and independent gateways
        env:
          MODEL_ROUTE_TEST_REDIS: 127.0.0.1:6389
          MODEL_ROUTE_ALLOW_REDIS_PAUSE: '1'
        run: |
          go test ./pkg/modelroute -run '^TestModelRoutingRealRedisProcesses$' -count=1 -timeout 90s
          go test ./controller -run '^TestModelRoutingTwoGatewayProcesses$' -count=1 -timeout 90s

  frontend:
    name: Frontend subscription lint, typecheck, test, and build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint subscription administration UI
        run: >-
          bunx oxlint -c .oxlintrc.json
          src/features/subscriptions/index.tsx
          src/features/subscriptions/components/subscriptions-table.tsx
          src/features/subscriptions/components/subscription-plan-cards.tsx
          src/features/subscriptions/components/subscriptions-primary-buttons.tsx
          src/features/subscriptions/components/subscriptions-dialogs.tsx
          src/features/subscriptions/components/dialogs/create-subscription-codes-dialog.tsx
          src/features/subscriptions/lib/redemption.ts
          src/features/subscriptions/lib/__tests__/redemption.test.ts
          src/features/subscriptions/components/__tests__/plan-cards.test.tsx

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Production build
        run: bun run build
